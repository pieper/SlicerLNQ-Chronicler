name: tofu destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy lnq-chronicle" to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'destroy lnq-chronicle' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ops/terraform
    env:
      OS_AUTH_TYPE: v3applicationcredential
      OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
      OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APP_CRED_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APP_CRED_SECRET }}
      OS_INTERFACE: public
      OS_IDENTITY_API_VERSION: "3"
      TF_VAR_cloud_name: openstack
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_floating_ip_address: ${{ secrets.FLOATING_IP }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}
      TF_VAR_couchdb_admin_password: ${{ secrets.COUCHDB_ADMIN_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Write clouds.yaml for Terraform
        run: |
          mkdir -p ~/.config/openstack
          cat > ~/.config/openstack/clouds.yaml <<EOF
          clouds:
            openstack:
              auth_type: v3applicationcredential
              auth:
                auth_url: ${{ secrets.OS_AUTH_URL }}
                application_credential_id: ${{ secrets.OS_APP_CRED_ID }}
                application_credential_secret: ${{ secrets.OS_APP_CRED_SECRET }}
              region_name: ${{ secrets.OS_REGION_NAME }}
              interface: public
              identity_api_version: 3
          EOF

      - name: tofu init
        run: |
          tofu init \
            -backend-config="auth_url=${{ secrets.OS_AUTH_URL }}" \
            -backend-config="region_name=${{ secrets.OS_REGION_NAME }}" \
            -backend-config="application_credential_id=${{ secrets.OS_APP_CRED_ID }}" \
            -backend-config="application_credential_secret=${{ secrets.OS_APP_CRED_SECRET }}"

      - name: tofu destroy
        run: tofu destroy -auto-approve -input=false
