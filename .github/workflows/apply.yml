name: tofu apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  contents: read

# Serialize state-mutating runs across apply.yml and destroy.yml.
concurrency:
  group: lnq-chronicler-state
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.inputs.confirm == 'apply' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ops/terraform
    env:
      OS_AUTH_TYPE: v3applicationcredential
      OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
      OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APP_CRED_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APP_CRED_SECRET }}
      OS_INTERFACE: public
      OS_IDENTITY_API_VERSION: "3"
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_floating_ip_address: ${{ secrets.FLOATING_IP }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}
      TF_VAR_couchdb_admin_password: ${{ secrets.COUCHDB_ADMIN_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_os_auth_url: ${{ secrets.OS_AUTH_URL }}
      TF_VAR_os_region_name: ${{ secrets.OS_REGION_NAME }}
      TF_VAR_watchman_os_app_cred_id: ${{ secrets.WATCHMAN_OS_APP_CRED_ID }}
      TF_VAR_watchman_os_app_cred_secret: ${{ secrets.WATCHMAN_OS_APP_CRED_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openstack CLI
        run: pip install --quiet python-openstackclient python-swiftclient

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Pull state from Swift (if any)
        run: |
          if openstack object show lnq-chronicler-tfstate terraform.tfstate >/dev/null 2>&1; then
            openstack object save lnq-chronicler-tfstate terraform.tfstate
            echo "Pulled prior state from Swift."
          else
            echo "No prior state in Swift — first run."
          fi

      - name: tofu init
        run: tofu init -input=false

      - name: tofu apply
        run: tofu apply -auto-approve -input=false

      - name: Show outputs
        run: tofu output

      - name: Push state to Swift
        if: always()
        run: |
          if [ -f terraform.tfstate ]; then
            openstack object create lnq-chronicler-tfstate terraform.tfstate
            # Timestamped archive copy for history
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            openstack object create lnq-chronicler-tfstate-archive terraform.tfstate \
              --name "terraform-${ts}.tfstate"
            echo "Pushed state and archive copy (${ts})."
          else
            echo "No state file to push."
          fi
